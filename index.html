<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulsefield Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pf: {
              bg: '#0B1416', void: '#070D0F', panel: '#151E21', panel2: '#1B262A', line: '#24333A',
              player: '#FFB347', danger: '#FF4D5E', accent: '#7CFFB2', hot: '#B6FFD6', signal: '#4DD8FF',
              text: '#D8E2E4', muted: '#7B8D92'
            }
          },
          fontFamily: {
            display: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace']
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="h-screen flex flex-col overflow-hidden bg-pf-bg text-pf-text font-display select-none">

  <header class="h-12 shrink-0 flex items-center gap-4 px-4 bg-pf-panel border-b border-pf-line">
    <div class="flex items-center gap-2.5">
      <span class="logo-diamond"></span>
      <span class="font-bold tracking-[0.22em] text-sm">PULSEFIELD</span>
      <span class="font-mono text-[10px] text-pf-muted border border-pf-line rounded px-1.5 py-0.5">editor v0.0.1</span>
    </div>

    <div class="flex items-center gap-3 ml-4">
      <div class="pf-group">
        <button id="btn-stop" class="pf-btn pf-btn-icon" title="Voltar ao início (Home)"><svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><rect x="2.5" y="3" width="1.8" height="10"/><path d="M13 3v10L5.5 8z"/></svg></button>
        <button id="btn-play" class="pf-btn w-24" title="Tocar / pausar (Espaço)">Tocar</button>
      </div>
      <span id="time-display" class="pf-time text-sm w-20">00:00.00</span>
      <button id="btn-snap" class="pf-btn font-mono text-[11px] text-pf-muted" title="Encaixe na batida (G liga/desliga · Shift+G subdivisão · B bate o ritmo)">sem BPM</button>
    </div>

    <div class="flex items-center gap-2 min-w-0">
      <button id="btn-music" class="pf-btn" title="Importar música (MP3, WAV, OGG, FLAC, M4A)"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="#4DD8FF" stroke-width="1.5"><path d="M1.5 8h2l1.5-4 2 8 2-10 2 9 1.5-3h2"/></svg>Música</button>
      <span id="music-name" class="text-xs text-pf-muted truncate max-w-[180px]">sem música</span>
      <button id="btn-music-clear" class="pf-btn pf-btn-icon pf-btn-danger hidden" title="Remover música"><svg viewBox="0 0 16 16" width="12" height="12" stroke="currentColor" stroke-width="1.6"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button>
      <input id="volume" type="range" min="0" max="1" step="0.01" class="w-20" title="Volume">
      <input type="file" id="music-input" accept="audio/*,.mp3,.wav,.ogg,.oga,.opus,.flac,.m4a" class="hidden">
    </div>

    <div class="ml-auto flex items-center gap-2">
      <div class="pf-group">
        <button id="btn-undo" class="pf-btn pf-btn-icon" title="Desfazer (Ctrl+Z)"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 2.5L2 5.5l3 3"/><path d="M2.5 5.5H10a3.5 3.5 0 0 1 0 7H6"/></svg></button>
        <button id="btn-redo" class="pf-btn pf-btn-icon" title="Refazer (Ctrl+Y)"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 2.5l3 3-3 3"/><path d="M13.5 5.5H6a3.5 3.5 0 0 0 0 7h4"/></svg></button>
      </div>
      <button id="btn-clear" class="pf-btn pf-btn-danger" title="Apagar todos os perigos da fase (Ctrl+Z desfaz)"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M6 4V2h4v2M3.5 4l1 10h7l1-10M6.5 7v4.5M9.5 7v4.5"/></svg>Apagar tudo</button>
      <span class="w-px h-6 bg-pf-line mx-1"></span>
      <button id="btn-online" class="pf-btn" title="Fases online"><span id="online-dot" class="inline-block w-2 h-2 rotate-45 bg-pf-danger"></span>Online <span id="online-count" class="font-mono text-pf-muted">off</span></button>
      <div class="pf-group">
        <button id="btn-import" class="pf-btn" title="Importar fase (JSON)"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1.5v8M4.5 6L8 9.5 11.5 6M2 10.5v3.5h12v-3.5"/></svg>Importar</button>
        <button id="btn-export" class="pf-btn" title="Exportar fase (JSON)"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 10V2M4.5 5.5L8 2l3.5 3.5M2 10.5v3.5h12v-3.5"/></svg>Exportar</button>
      </div>
      <button id="btn-test" class="pf-btn pf-btn-primary w-36" title="Testar a fase a partir do playhead (T)"><svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor"><path d="M8 1l7 7-7 7-7-7z"/></svg>Testar <span class="font-mono text-[10px] opacity-60">T</span></button>
      <input type="file" id="file-input" accept=".json,application/json" class="hidden">
    </div>
  </header>

  <div class="flex flex-1 min-h-0">
    <nav id="toolbar" class="w-[72px] shrink-0 bg-pf-panel border-r border-pf-line flex flex-col items-center gap-0.5 py-2 overflow-y-auto"></nav>

    <main id="stage-wrap" class="flex-1 min-w-0 relative flex items-center justify-center">
      <canvas id="stage" class="block rounded-sm"></canvas>
      <div id="hud" class="hidden absolute top-4 left-1/2 -translate-x-1/2 pf-bracket font-mono text-xs bg-pf-panel/90 border border-pf-line px-3 py-1.5 whitespace-nowrap"></div>
    </main>

    <aside id="panel" class="w-72 shrink-0 bg-pf-panel border-l border-pf-line overflow-y-auto"></aside>
  </div>

  <section id="timeline-wrap" class="h-[320px] shrink-0 border-t border-pf-line bg-pf-panel relative">
    <canvas id="timeline" class="absolute inset-0 w-full h-full"></canvas>
  </section>

  <div id="modal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
    <div class="pf-window pf-bracket w-full max-w-md">
      <div id="modal-body" class="p-5"></div>
      <div class="px-5 pb-5 flex justify-end">
        <button id="modal-ok" class="pf-btn pf-btn-primary">Entendi</button>
      </div>
    </div>
  </div>

  <div id="online-modal" class="hidden fixed inset-0 z-40 bg-black/60 flex items-center justify-center p-4">
    <div class="pf-window pf-bracket w-full max-w-lg max-h-full flex flex-col">
      <div class="flex items-center gap-3 px-5 py-4 border-b border-pf-line">
        <h2 class="font-bold tracking-[0.18em] text-sm uppercase flex items-center gap-2"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="#7CFFB2" stroke-width="1.4"><circle cx="8" cy="8" r="6.2"/><path d="M1.8 8h12.4M8 1.8c2 2.2 2 10.2 0 12.4M8 1.8c-2 2.2-2 10.2 0 12.4"/></svg>Fases online</h2>
        <span id="online-status" class="text-xs text-pf-danger">Sem conexão com o servidor</span>
        <button id="online-close" class="pf-btn pf-btn-icon ml-auto" title="Fechar (Esc)"><svg viewBox="0 0 16 16" width="12" height="12" stroke="currentColor" stroke-width="1.6"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button>
      </div>

      <div class="px-5 py-4 border-b border-pf-line">
        <h3 class="text-[10px] uppercase tracking-[0.18em] text-pf-muted mb-2 font-semibold">Publicar minha fase</h3>
        <p id="online-level" class="text-xs text-pf-text/80 mb-2 truncate"></p>
        <div id="online-music" class="space-y-1.5 mb-3"></div>
        <div class="flex gap-2">
          <input id="online-author" class="pf-text flex-1" maxlength="24" placeholder="Seu nome">
          <button id="online-publish" class="pf-btn pf-btn-primary">Publicar</button>
        </div>
        <p id="online-msg" class="text-xs mt-2"></p>
      </div>

      <div class="px-5 pt-4 pb-2 min-h-0 flex flex-col">
        <h3 class="text-[10px] uppercase tracking-[0.18em] text-pf-muted mb-2 font-semibold">Publicadas por todos</h3>
        <div id="online-list" class="space-y-2 overflow-y-auto max-h-[42vh] pr-1"></div>
      </div>

      <div class="px-5 py-3 border-t border-pf-line flex items-center gap-2">
        <label class="text-[11px] text-pf-muted shrink-0">Servidor</label>
        <input id="online-server" class="pf-text flex-1 text-[11px]" spellcheck="false">
        <button id="online-connect" class="pf-btn">Conectar</button>
      </div>
    </div>
  </div>

  <div id="toasts" class="fixed top-14 right-4 z-50 flex flex-col items-end gap-2 pointer-events-none"></div>

  <script src="js/config.js"></script>
  <script src="js/musiccheck.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/transform.js"></script>
  <script src="js/hazards.js"></script>
  <script src="js/levelcheck.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
  <script src="js/online.js"></script>
</body>
</html>
